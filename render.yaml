# render.yaml — Render Infrastructure-as-Code blueprint
# Defines both backend services for one-click deploy via Render Dashboard.

services:
  # -----------------------------------------------------------------------
  # Service A — Ingestion & Detection (port 8000)
  # -----------------------------------------------------------------------
  - type: web
    name: cybershield-ingestion
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: HOST
        value: "0.0.0.0"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      - key: APP_MODULE
        value: "ingestion_detection.main:app"
      # A → B forwarding: set to Service B's public Render URL once deployed.
      - key: CORRELATION_BASE_URL
        value: "https://cybershield-correlation.onrender.com"
      - key: CORRELATION_FORWARD_ENABLED
        value: "true"
      - fromGroup: cybershield-secrets

  # -----------------------------------------------------------------------
  # Service B — Correlation & Response (port 8001)
  # -----------------------------------------------------------------------
  - type: web
    name: cybershield-correlation
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8001"
      - key: HOST
        value: "0.0.0.0"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      - key: APP_MODULE
        value: "correlation_response.main:app"
      - fromGroup: cybershield-secrets

# -----------------------------------------------------------------------
# Environment Group — Render prompts for these secrets during Blueprint setup
# -----------------------------------------------------------------------
envVarGroups:
  - name: cybershield-secrets
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SIGNUP_INVITE_TOKEN
        sync: false
      - key: CORR_NEO4J_URI
        sync: false
      - key: CORR_NEO4J_USER
        sync: false
      - key: CORR_NEO4J_PASSWORD
        sync: false
      - key: CORR_GEMINI_API_KEY
        sync: false
