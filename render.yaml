# render.yaml — Render Infrastructure-as-Code blueprint
# Defines both backend services for one-click deploy via Render Dashboard.
#
# Usage:
#   1. Push this file to the repo root.
#   2. In Render Dashboard → Blueprints → New Blueprint Instance → select this repo.
#   3. Fill in the env-group secrets (Supabase keys, CORS origins).
#   4. Deploy.
#
# Service A (ingestion_detection) runs on port 8000.
# Service B (correlation_response) runs on port 8001.
# Both share the same Docker image (root Dockerfile) with different start commands.

services:
  # -----------------------------------------------------------------------
  # Service A — Ingestion & Detection (port 8000)
  # -----------------------------------------------------------------------
  - type: web
    name: cybershield-ingestion
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: HOST
        value: "0.0.0.0"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      # A → B forwarding: set to Service B's public Render URL once deployed.
      - key: CORRELATION_BASE_URL
        value: "https://cybershield-correlation.onrender.com"
      - key: CORRELATION_FORWARD_ENABLED
        value: "true"
      # Supabase
      - key: SUPABASE_URL
        fromGroup: cybershield-secrets
      - key: SUPABASE_PUBLISHABLE_KEY
        fromGroup: cybershield-secrets
      - key: SUPABASE_SECRET_KEY
        fromGroup: cybershield-secrets
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromGroup: cybershield-secrets
      - key: SUPABASE_JWKS_URL
        fromGroup: cybershield-secrets
      # CORS: set to the Vercel frontend origin once deployed.
      - key: CORS_ALLOWED_ORIGINS
        fromGroup: cybershield-secrets
      # Signup gating
      - key: SIGNUP_INVITE_TOKEN
        fromGroup: cybershield-secrets
    startCommand: gunicorn ingestion_detection.main:app -c deploy/gunicorn_conf.py

  # -----------------------------------------------------------------------
  # Service B — Correlation & Response (port 8001)
  # -----------------------------------------------------------------------
  - type: web
    name: cybershield-correlation
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8001"
      - key: HOST
        value: "0.0.0.0"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      # Supabase
      - key: SUPABASE_URL
        fromGroup: cybershield-secrets
      - key: SUPABASE_PUBLISHABLE_KEY
        fromGroup: cybershield-secrets
      - key: SUPABASE_JWKS_URL
        fromGroup: cybershield-secrets
      # CORS: set to the Vercel frontend origin once deployed.
      - key: CORS_ALLOWED_ORIGINS
        fromGroup: cybershield-secrets
      # Neo4j Aura (optional — graph features degrade gracefully)
      - key: CORR_NEO4J_URI
        fromGroup: cybershield-secrets
      - key: CORR_NEO4J_USER
        fromGroup: cybershield-secrets
      - key: CORR_NEO4J_PASSWORD
        fromGroup: cybershield-secrets
      # Gemini (optional — narrative generation)
      - key: CORR_GEMINI_API_KEY
        fromGroup: cybershield-secrets
    startCommand: gunicorn correlation_response.main:app -c deploy/gunicorn_conf.py

# -----------------------------------------------------------------------
# Env group — create this in Render Dashboard → Environment → Groups
# -----------------------------------------------------------------------
# Create a group named "cybershield-secrets" with these keys:
#   SUPABASE_URL              = https://<project>.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  = sb_publishable_...
#   SUPABASE_SECRET_KEY       = sb_secret_...       (A only, but group-shared is fine)
#   SUPABASE_SERVICE_ROLE_KEY = eyJ...               (A only)
#   SUPABASE_JWKS_URL         = https://<project>.supabase.co/auth/v1/.well-known/jwks.json
#   CORS_ALLOWED_ORIGINS      = https://your-app.vercel.app
#   SIGNUP_INVITE_TOKEN       = <your-invite-token>  (or leave empty to disable signup)
#   CORR_NEO4J_URI            = neo4j+s://...
#   CORR_NEO4J_USER           = ...
#   CORR_NEO4J_PASSWORD       = ...
#   CORR_GEMINI_API_KEY       = ...
