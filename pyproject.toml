[project]
name = "etai-hack"
version = "0.1.0"
description = "AI-powered SOC dashboard — ingestion, detection, correlation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "numpy>=2.1",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "joblib>=1.4",
    "pyarrow>=18.0",
    "openpyxl>=3.1",
    "neo4j>=5.20",
]

[project.scripts]
ingest-api = "ingestion_detection.main:run"
replay = "ingestion_detection.replay.replay:main"
correlation-api = "correlation_response.main:run"
replay-correlate = "correlation_response.replay_to_correlate:main"
neo4j-seed = "correlation_response.graph.neo4j_loader:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingestion_detection*", "shared*", "correlation_response*"]
