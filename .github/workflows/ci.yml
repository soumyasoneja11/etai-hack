name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (pinned lock from pyproject.toml)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint (ruff — syntax/undefined-name errors)
        run: ruff check --select E9,F63,F7,F82 shared ingestion_detection correlation_response tests scripts

      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (real mode — mock disabled)
        run: npm run build
        env:
          NEXT_PUBLIC_USE_MOCK_API: "false"
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8001"

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: etai-hack-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: etai-hack-frontend:ci
          build-args: |
            NEXT_PUBLIC_USE_MOCK_API=false
            NEXT_PUBLIC_API_BASE_URL=http://localhost:8001
